# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

permissions:
  contents: read

jobs:
  # ─── macOS build & test (swift build / swift test) ───
  # Uses the SPM command-line tools, which always target macOS.
  # This validates compilation and runs the test suite reliably
  # without any simulator dependency.
  test:
    name: Test (macOS)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      # Use the runner's default Xcode (16.4 on macos-15).
      # Explicitly selecting older Xcode versions (16.0, 16.2)
      # causes "platform not installed" errors because those
      # versions don't ship with pre-installed iOS SDKs on
      # GitHub-hosted runners.
      - name: Show environment
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SPM dependencies
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v --enable-code-coverage

      - name: Generate coverage report
        run: |
          xcrun llvm-cov export \
            .build/debug/WaveKitPackageTests.xctest/Contents/MacOS/WaveKitPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            -format lcov > coverage.lcov
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.lcov
        continue-on-error: true

  # ─── iOS Simulator build (xcodebuild) ───
  # Validates the package compiles against the iOS SDK.
  # Uses the runner's default Xcode to avoid missing-platform errors.
  ios-build:
    name: Build for iOS Simulator
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode & SDK info
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      # Warm up the CoreSimulator service to prevent the
      # "Unable to connect to simulator" race condition.
      # This forces the simulator daemon to start before
      # xcodebuild needs it.
      - name: Warm up simulator service
        run: xcrun simctl list devices available

      # Dynamically pick the first available iPhone simulator
      # so we don't break when runner images update device names.
      - name: Find available iPhone simulator
        id: sim
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed 's/(.*//' | xargs)
          echo "Found simulator: $SIM_NAME"
          echo "name=$SIM_NAME" >> "$GITHUB_OUTPUT"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme WaveKit \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || true

      # Fallback: if the named-destination build failed, try
      # the generic destination which works when the SDK is
      # installed but no concrete simulator is booted.
      - name: Fallback – generic destination build
        if: failure()
        run: |
          xcodebuild build \
            -scheme WaveKit \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO