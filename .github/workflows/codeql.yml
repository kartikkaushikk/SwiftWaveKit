name: "CodeQL Advanced"

on:
  push:
    branches: ["master", "development"]
  pull_request:
    branches: ["master", "development"]
  schedule:
    - cron: '26 23 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-15') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: autobuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Warm up simulator service to prevent intermittent
      # "Unable to connect to simulator" errors during autobuild.
      - name: Warm up simulator service
        if: matrix.language == 'swift'
        run: xcrun simctl list devices available > /dev/null

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'If you are using a "manual" build mode for one or more of the' \
            'languages you are analyzing, replace this with the commands to build' \
            'your code, for example:'
          echo '  make bootstrap'
          echo '  make release'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
